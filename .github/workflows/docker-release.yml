name: Docker Image Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
      prerelease:
        description: Mark the release as a development prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image_name: kalenda-backend
            dockerfile: docker/Dockerfile.backend
          - image_name: kalenda-puppeteer
            dockerfile: docker/puppeteer/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release tag
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          prerelease="${{ github.event.release.prerelease == true || inputs.prerelease == true }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag"
            exit 1
          fi
          if [[ "$prerelease" != "true" ]]; then
            git fetch origin main
            tag_commit="$(git rev-list -n 1 "$tag")"
            main_commit="$(git rev-parse origin/main)"
            if ! git merge-base --is-ancestor "$tag_commit" "$main_commit"; then
              echo "Stable releases must point to a commit contained in main."
              echo "Tag commit:  $tag_commit"
              echo "Main commit: $main_commit"
              exit 1
            fi
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name || inputs.tag }}
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
