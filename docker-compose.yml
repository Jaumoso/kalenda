services:
  postgres:
    image: postgres:16-alpine
    container_name: kalenda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kalenda}
      POSTGRES_USER: ${POSTGRES_USER:-kalenda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kalenda}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/jaumoso/kalenda-backend:${APP_TAG:-latest}
    container_name: kalenda-backend
    user: '1000:1000'
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-kalenda}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kalenda}?schema=public
      - NODE_ENV=production
      - COOKIE_SECRET=${COOKIE_SECRET:?COOKIE_SECRET is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - UPLOAD_PATH=/data/uploads
      - EXPORT_PATH=/data/exports
      - FRONTEND_URL=http://backend:3000
      - PUPPETEER_URL=http://puppeteer:4000
      - ADMIN_EMAIL=${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    volumes:
      - ./data:/data
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/api/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  puppeteer:
    image: ghcr.io/jaumoso/kalenda-puppeteer:${APP_TAG:-latest}
    user: '1000:1000'
    environment:
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
      - FRONTEND_URL=http://backend:3000
    volumes:
      - ./data/exports:/data/exports
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:4000/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    container_name: kalenda-backup
    user: '0:0'
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-kalenda}
      - POSTGRES_USER=${POSTGRES_USER:-kalenda}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/kalenda-backup:ro
    entrypoint: ['/usr/local/bin/kalenda-backup']
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
